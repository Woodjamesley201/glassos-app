defApp("play","Play Store",["#34d399","#0d9488"],"store",b=>{
  b.innerHTML='<input class="field" id="q" placeholder="Search apps & games" style="margin-bottom:14px">';
  const l=E("div","list");b.appendChild(l);
  CATALOG.forEach(([n,c,col,rt])=>{const it=E("div","item",`<span class="ic" style="background:${col}">${ico("star")}</span>
    <div style="flex:1"><div style="font-weight:700">${n}</div><div class="muted">${c} · ★ ${rt}</div></div>`);
    const btn=E("div","chip",S.installed.includes(n)?"Open":"Install");
    btn.onclick=e=>{e.stopPropagation();
      if(S.installed.includes(n)){toast(n+" opened");return}
      btn.textContent="…";let p=0;
      const iv=setInterval(()=>{p+=12;btn.textContent=p+"%";
        if(p>=100){clearInterval(iv);if(!S.installed.includes(n))S.installed.push(n);save();btn.textContent="Open";toast(n+" installed");buildHome()}},110)};
    it.appendChild(btn);l.appendChild(it)})});

defApp("ai","OneAI",["#a855f7","#6d28d9"],"ai",b=>{
  b.innerHTML='<div id="chat" style="display:flex;flex-direction:column"></div>';
  const push=(t,me)=>{$("#chat",b).appendChild(E("div","msg "+(me?"me":"them"),t));b.scrollTop=b.scrollHeight};
  push("Hi "+S.name+". I can drive this device for you. Try: “open settings”, “install Spotify”, “turn on dark mode”, “check for updates”, “what are my specs”.");
  const row=E("div");row.style.cssText="display:flex;gap:8px;margin-top:10px";
  const i=E("input","field");i.placeholder="Ask OneAI…";const s=E("div","chip","↑");
  const send=()=>{const q=i.value.trim();if(!q)return;push(q,true);i.value="";setTimeout(()=>push(reply(q)),420)};
  s.onclick=send;i.onkeydown=e=>{if(e.key==="Enter")send()};row.append(i,s);b.appendChild(row)});

function reply(q){
  const t=q.toLowerCase();
  const m=t.match(/open (\w+)/);
  if(m){const a=Object.values(APPS).find(a=>a.n.toLowerCase().startsWith(m[1]));
    if(a){setTimeout(()=>openApp(a.id),250);return "Opening "+a.n+"."}}
  if(t.includes("install")){const n=CATALOG.find(c=>t.includes(c[0].toLowerCase()));
    if(n){if(!S.installed.includes(n[0]))S.installed.push(n[0]);save();buildHome();return n[0]+" installed to your home screen."}}
  if(t.includes("dark")){S.dark=!t.includes("off");save();return "Dark mode "+(S.dark?"on":"off")+"."}
  if(t.includes("update")){setTimeout(()=>openApp("settings",{sec:"update"}),250);return "Opening Software Update."}
  if(t.includes("spec"))return "OneOS Pad Pro · N1 Ultra · 16 GB RAM · 512 GB storage · 10,090 mAh at 86%.";
  if(t.includes("desk")){setTimeout(toggleDesk,250);return "Entering OneDesk."}
  if(t.includes("battery"))return "86% — about 9 hours left.";
  const c=["Done.","Got it — anything else?","That's handled.","I can also toggle OneDesk, check updates, or install apps."];
  return c[Math.floor(Math.random()*c.length)];
}

defApp("settings","Settings",["#64748b","#334155"],"settings",(b,opts)=>{
  const sec=opts&&opts.sec;b.innerHTML="";
  const row=(ic,t,sub,fn,col="#3a4250")=>{const it=E("div","item",`<span class="ic" style="background:${col}">${ico(ic)}</span>
    <div style="flex:1"><div style="font-weight:650">${t}</div>${sub?`<div class="muted">${sub}</div>`:""}</div><span class="chev">›</span>`);
    it.onclick=fn;b.appendChild(it)};
  const hdr=t=>b.appendChild(E("h2","sec",t));

  hdr("Device");
  const u=E("div","glass");u.style.cssText="padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:10px";
  u.innerHTML=`<div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(140deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:750">${(S.name||"A")[0]}</div>
    <div><div style="font-weight:750">${S.name}</div><div class="muted">OneOS Account · ${S.wifi||"Offline"}</div></div>`;
  b.appendChild(u);

  hdr("Connectivity");
  row("wifi","Wi-Fi",S.wifiOn?(S.wifi||"On"):"Off",()=>{S.wifiOn=!S.wifiOn;save();openApp("settings")},"#2563eb");
  row("bt","Bluetooth",S.bt?"On":"Off",()=>{S.bt=!S.bt;save();openApp("settings")},"#4f46e5");
  row("moon","Do Not Disturb",S.dnd?"On":"Off",()=>{S.dnd=!S.dnd;save();openApp("settings")},"#7c3aed");

  hdr("Display");
  row("sun","Appearance","Dark",()=>{S.dark=!S.dark;toast("Appearance updated");openApp("settings")},"#f59e0b");
  const acc=E("div");acc.style.cssText="display:flex;gap:8px;padding:10px 0;flex-wrap:wrap";
  ["#5b8cff","#a855f7","#22c55e","#f43f5e","#f59e0b","#06b6d4"].forEach(c=>{const d=E("div");
    d.style.cssText=`width:34px;height:34px;border-radius:50%;background:${c};cursor:pointer;border:2px solid ${S.accent===c?"#fff":"transparent"}`;
    d.onclick=()=>{S.accent=c;applyTheme();save();openApp("settings")};acc.appendChild(d)});
  b.appendChild(acc);
  const shp=E("div");shp.style.cssText="display:flex;gap:8px;padding:4px 0 10px";
  ["squircle","soft","round","square"].forEach(s=>{const c=E("div","chip"+(S.shape===s?" on":""),s);
    c.onclick=()=>{S.shape=s;applyTheme();save();openApp("settings")};shp.appendChild(c)});
  b.appendChild(shp);

  hdr("System");
  row("goodlock","Good Lock","Modules & customization",()=>openApp("goodlock"),"#8b5cf6");
  row("onedesk","OneDesk","Desktop mode",()=>toggleDesk(),"#0ea5e9");
  row("update","Software Update",S.ver+" · up to date",()=>openApp("settings",{sec:"update"}),"#22c55e");
  row("ai","OneAI","Assistant",()=>openApp("ai"),"#a855f7");

  hdr("About");
  row("settings","System specs","Model, chip, memory",()=>openApp("settings",{sec:"specs"}),"#475569");
  row("trash","Reset OneOS","Erase all data",()=>{if(confirm("Erase all OneOS data?")){localStorage.clear();location.reload()}},"#ef4444");

  if(sec==="specs"){
    b.innerHTML="";b.appendChild(E("h2","sec","System specs"));
    [["Device name",S.name+"'s OneOS Pad"],["Model","SM-X910 (OneOS Pad Pro)"],["Chipset","OneOS N1 Ultra · 8-core"],
     ["RAM","16 GB LPDDR5X"],["Storage","512 GB · 148 GB used"],["Display","11.0\" 2880×1848 · 120 Hz"],
     ["Battery","10,090 mAh · 86%"],["Kernel","5.15.104-oneos"],["Build","OneOS "+S.ver+" (AP1A)"],["Security patch","2026-10-05"]]
      .forEach(([k,v])=>{const it=E("div","item",`<span class="dim2" style="flex:1">${k}</span><span style="font-weight:650">${v}</span>`);
        b.appendChild(it)});
    const st=E("div","glass");st.style.cssText="padding:14px;margin-top:14px";
    st.innerHTML='<div class="muted" style="margin-bottom:6px">Storage · 148 GB of 512 GB</div><div class="prog"><i style="width:29%"></i></div>';
    b.appendChild(st)}

  if(sec==="update"){
    b.innerHTML="";b.appendChild(E("h2","sec","Software Update"));
    const card=E("div","glass");card.style.cssText="padding:18px";
    card.innerHTML=`<div style="font-size:17px;font-weight:750">OneOS ${S.ver}</div>
      <div class="muted" style="margin:4px 0 12px">Build AP1A · Security patch 2026-10-05</div>
      <div id="updBody" class="muted">Checking for updates…</div>`;
    b.appendChild(card);
    setTimeout(()=>{
      const nv=(parseFloat(S.ver)+0.1).toFixed(1)+".0";
      $("#updBody").innerHTML=`<div style="font-weight:700;color:#fff;font-size:14px">OneOS ${nv} available</div>
        <div style="margin:4px 0 10px">• Refined liquid glass blur<br>• OneDesk window snapping<br>• Camera low-light fix<br>• October security patch</div>`;
      const btn=E("div","btn","Download & Install");btn.style.marginTop="6px";
      const pr=E("div","prog");pr.innerHTML="<i></i>";
      btn.onclick=()=>{btn.style.display="none";card.appendChild(pr);let p=0;
        const iv=setInterval(()=>{p+=5;pr.firstChild.style.width=p+"%";
          if(p>=100){clearInterval(iv);$("#reboot").classList.add("on");
            setTimeout(()=>{S.ver=nv;save();$("#reboot").classList.remove("on");toast("OneOS "+nv+" installed");openApp("settings",{sec:"update"})},2600)}},60)};
      card.appendChild(btn)},1100)}
});

