/* ---------- HOME ---------- */
const PAGES=[
 ["files","reminders","maps","homeapp","camera","books","games","tv","news","galaxy","translate","memo"],
 ["messages","browser","music","mail","calendar","photos","calc","clock","weather","notes","contacts","podcasts"],
 ["play","onedesk","goodlock","ai","stocks","wallet","fitness","journal","shortcuts","tips","freeform","measure","photobooth","keynote","pages","numbers"]];
function appIcon(id){const a=APPS[id];if(!a)return null;
  const el=E("div","icon",`<div class="sq" style="background:linear-gradient(150deg,${a.c[0]},${a.c[1]})">${ico(a.ic)}</div><div class="nm">${a.n}</div>`);
  el.onclick=()=>openApp(id);return el}
function buildHome(){
  const h=$("#home");h.innerHTML="";
  const wr=E("div","wrow");
  wr.append(
    E("div","wcard glass",'<div class="lbl">Now</div><div class="big" id="wclock">9:41</div><div class="muted">Wednesday, Apr 1</div>'),
    E("div","wcard glass",'<div class="lbl">San Francisco</div><div class="big">54°</div><div class="muted">Partly cloudy · H57 L49</div>'));
  h.appendChild(wr);
  h.appendChild(E("div","wcard glass wide",'<div class="lbl">Today</div><div style="font-size:13px;font-weight:650">Design review · 10:00</div><div class="muted">Coffee with Sam · 13:30</div>'));
  const pg=E("div","pages");h.appendChild(pg);
  PAGES.forEach((p,i)=>{const d=E("div","page"+(i?" off":""));pg.appendChild(d);
    p.forEach(id=>{const ic=appIcon(id);if(ic)d.appendChild(ic)})});
  CATALOG.forEach(([n,c,col])=>{if(S.installed.includes(n)){
    const sq=E("div","icon",`<div class="sq" style="background:${col}">${ico("star")}</div><div class="nm">${n}</div>`);
    sq.onclick=()=>toast(n+" opened");pg.children[2].appendChild(sq)}});
  const dr=E("div","dotsrow");PAGES.forEach((_,i)=>dr.appendChild(E("i",i===S.page?"on":"")));h.appendChild(dr);
  const dock=E("div","glass");dock.id="dock";h.appendChild(dock);
  ["messages","browser","photos","settings"].forEach(id=>dock.appendChild(appIcon(id)));
  let sx=0;
  pg.addEventListener("pointerdown",e=>sx=e.clientX);
  pg.addEventListener("pointerup",e=>{const dx=e.clientX-sx;
    if(Math.abs(dx)>50){S.page=Math.max(0,Math.min(PAGES.length-1,S.page+(dx<0?1:-1)));save();
      [...pg.children].forEach((c,i)=>c.classList.toggle("off",i!==S.page));
      [...dr.children].forEach((c,i)=>c.classList.toggle("on",i===S.page))}});
  setInterval(()=>{const c=$("#wclock");if(c)c.textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})},5000);
}

/* ---------- NAV ---------- */
let stack=[],recent=[];
function renderApp(id,opts){
  const a=APPS[id];if(!a)return;
  const layer=$("#appLayer");layer.classList.add("on");layer.innerHTML="";
  const app=E("div","app");
  const head=E("div","apphead",`<div class="back">${ico("back")}</div><div class="t">${a.n}</div>`);
  head.querySelector(".back").onclick=goBack;
  const body=E("div","appbody");
  app.append(head,body);layer.appendChild(app);
  a.fn(body,opts);
  stack.push(id);
  $("#nav").classList.add("on");
  $("#aiFab").style.display=id==="ai"?"none":"flex";
}
function openApp(id,opts){renderApp(id,opts);recent=recent.filter(x=>x!==id);recent.push(id)}
function goBack(){stack.pop();if(stack.length)renderApp(stack[stack.length-1]);else goHome()}
function closeAll(){$("#appLayer").classList.remove("on");$("#appLayer").innerHTML="";$("#nav").classList.remove("on");$("#aiFab").style.display="none";stack=[]}
function goHome(){closeAll();$("#home").classList.remove("away")}

/* ---------- DESK ---------- */
let deskOn=false;
function toggleDesk(){
  deskOn=!deskOn;const d=$("#desk");
  if(!deskOn){d.classList.remove("on");d.innerHTML="";return}
  closeAll();d.classList.add("on");d.innerHTML="";
  const di=E("div");di.id="deskIcons";
  ["files","notes","browser","settings"].forEach(id=>di.appendChild(appIcon(id)));d.appendChild(di);
  const menu=E("div","glass");menu.id="startMenu";
  Object.keys(APPS).slice(0,20).forEach(id=>menu.appendChild(appIcon(id)));
  const tb=E("div","glass");tb.id="taskbar";
  const st=E("div","tb",ico("shortcuts"));
  st.onclick=e=>{e.stopPropagation();menu.classList.toggle("on")};
  tb.appendChild(st);
  ["browser","files","ai"].forEach(id=>{const x=E("div","tb",ico(APPS[id].ic));x.onclick=()=>makeWin(id);tb.appendChild(x)});
  const ex=E("div","tb",ico("back"));ex.onclick=toggleDesk;tb.appendChild(ex);
  d.append(tb,menu);
}
function makeWin(id){
  const d=$("#desk");if(!deskOn)return;
  const a=APPS[id];if(!a)return;
  const w=E("div","win");
  w.innerHTML=`<div class="wbar"><span class="wd" style="background:${a.c[0]}"></span><span class="wt">${a.n}</span>
    <span class="wb" data-a="min">–</span><span class="wb" data-a="close">✕</span></div><div class="wbody"></div>`;
  w.style.left=rnd(20,110)+"px";w.style.top=rnd(60,200)+"px";
  d.appendChild(w);a.fn(w.querySelector(".wbody"));
  const bar=w.querySelector(".wbar");let dx=0,dy=0,drag=false;
  bar.onpointerdown=e=>{if(e.target.dataset.a)return;drag=true;
    const r=w.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top};
  bar.onpointermove=e=>{if(!drag)return;w.style.left=(e.clientX-dx)+"px";w.style.top=Math.max(10,e.clientY-dy)+"px"};
  bar.onpointerup=()=>drag=false;
  w.querySelector('[data-a="close"]').onclick=()=>w.remove();
  w.querySelector('[data-a="min"]').onclick=()=>w.style.display="none";
  $("#startMenu").classList.remove("on");
}

/* ---------- CONTROL CENTER ---------- */
function buildCC(){
  const cc=$("#cc");cc.innerHTML="";
  const top=E("div","cctop");
  const T=(ic,label,on,fn)=>{const t=E("div","cctile "+(on?"act":"off2"),`${ico(ic)}<span>${label}</span>`);
    t.onclick=()=>{fn();buildCC()};return t};
  top.append(
    T("wifi","Wi-Fi",S.wifiOn,()=>{S.wifiOn=!S.wifiOn;save()}),
    T("bt","Bluetooth",S.bt,()=>{S.bt=!S.bt;save()}),
    T("moon","Focus",S.dnd,()=>{S.dnd=!S.dnd;save()}),
    T("onedesk","OneDesk",false,()=>{$("#cc").classList.remove("on");toggleDesk()}));
  cc.appendChild(top);
  const mk=(ic,val,fn)=>{const s=E("div","slider glass",`<div class="fill" style="width:${val}%"></div><span class="lbl">${ico(ic)}</span>`);
    const r=E("input");r.type="range";r.min=0;r.max=100;r.value=val;
    r.oninput=e=>{fn(+e.target.value);s.querySelector(".fill").style.width=e.target.value+"%"};s.appendChild(r);return s};
  cc.appendChild(mk("sun",S.bright,()=>{}));
  cc.appendChild(mk("vol",S.vol,()=>{}));
  const foot=E("div","ccfoot");
  const ai=E("div","chip on","✦ Ask OneAI");ai.onclick=()=>{$("#cc").classList.remove("on");openApp("ai")};
  const off=E("div","chip","Close");off.onclick=()=>cc.classList.remove("on");
  foot.append(ai,off);cc.appendChild(foot);
}

/* ---------- LOCK ---------- */
function buildLock(){
  const l=$("#lock");
  l.innerHTML=`<div class="time" id="lkTime">9:41</div><div class="date" id="lkDate"></div>
    <div class="lockwidgets">
      <div class="lw glass">${ico("weather")}54° SF</div>
      <div class="lw glass">${ico("calendar")}3 events</div>
      <div class="lw glass" id="lwai">${ico("ai")}OneAI</div></div>
    <div class="lockbottom"><div class="hint">Swipe up to unlock</div><div class="pill"></div></div>`;
  const up=()=>{const n=new Date();
    $("#lkTime").textContent=n.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}).replace(/^0/,"");
    $("#lkDate").textContent=n.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"}).replace(",","")};
  up();setInterval(up,1000);
  $("#lwai",l).onclick=()=>{unlock();setTimeout(()=>openApp("ai"),450)};
  l.addEventListener("pointerdown",e=>l.dataset.y=e.clientY);
  l.addEventListener("pointerup",e=>{if(+l.dataset.y-e.clientY>60)unlock()});
}
function unlock(){const l=$("#lock");l.classList.add("up");buildHome()}

/* ---------- SETUP ---------- */
let step=0;
const STEPS=[
 {h:"Hello.",p:"OneOS is a liquid-glass system built on OneUI foundations — with OneDesk, OneAI and a full app suite.",b:"Get started"},
 {h:"Language",p:"Choose your system language.",opts:["English (US)","Español","Français","Deutsch","한국어","日本語"]},
 {h:"Wi-Fi",p:"Pick a network to continue.",wifi:true},
 {h:"Your name",p:"OneOS personalizes OneAI and your device with this.",input:true},
 {h:"OneAI",p:"An assistant that can actually drive the OS — open apps, change settings, install things.",toggle:true},
 {h:"Appearance",p:"Dark, minimal, liquid glass. Pick an accent.",accent:true},
 {h:"Almost done",p:"OneOS collects diagnostics to improve the build.",b:"Finish setup"}];
function buildSetup(){
  const s=$("#setup");s.innerHTML="";
  const st=STEPS[step];
  s.appendChild(E("div","setuphead",'<div class="orb"></div>'));
  s.appendChild(E("h1",null,st.h));s.appendChild(E("p","sub",st.p));
  if(st.opts)st.opts.forEach(o=>{const d=E("div","opt"+(S.lang===o?" sel":""),`${o}<span class="chk"></span>`);
    d.onclick=()=>{S.lang=o;buildSetup()};s.appendChild(d)});
  if(st.wifi){
    ["OneOS_5G","HomeNet","Cafe_Guest","Neighbour"].forEach(n=>{const d=E("div","opt",`${n}${S.wifi===n?" ✓":""}`);
      d.onclick=()=>{S.wifi=n;toast("Connected to "+n);buildSetup()};s.appendChild(d)});
    if(S.wifi)s.appendChild(E("div","muted","Connected."))}
  if(st.input){const i=E("input","field");i.value=S.name;i.oninput=e=>S.name=e.target.value||"Alex";s.appendChild(i)}
  if(st.toggle){const r=E("div","opt",`<span>Enable OneAI</span><span class="sw${S.ai?" on":""}"><i></i></span>`);
    r.onclick=()=>{S.ai=!S.ai;buildSetup()};s.appendChild(r)}
  if(st.accent){const row=E("div");row.style.cssText="display:flex;gap:12px;justify-content:center;margin:10px 0";
    [["#5b8cff","#a06bff"],["#a855f7","#6d28d9"],["#22c55e","#0d9488"],["#f43f5e","#9f1239"],["#f59e0b","#c2410c"]].forEach(([a,bb])=>{
      const d=E("div");
      d.style.cssText=`width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,${a},${bb});cursor:pointer;border:2px solid ${S.accent===a?"#fff":"transparent"}`;
      d.onclick=()=>{S.accent=a;S.accent2=bb;applyTheme();buildSetup()};row.appendChild(d)});
    s.appendChild(row)}
  const dots=E("div","dots");STEPS.forEach((_,i)=>dots.appendChild(E("i",i===step?"on":"")));s.appendChild(dots);
  const btn=E("div","btn",st.b||"Continue");
  btn.onclick=()=>{
    if(step<STEPS.length-1){step++;buildSetup()}
    else{S.setup=true;save();$("#setup").style.display="none";buildLock();buildHome();toast("Welcome to OneOS, "+S.name)}};
  s.appendChild(btn);
  if(step>0){const bk=E("div","btn ghost","Back");bk.style.marginTop="8px";
    bk.onclick=()=>{step--;buildSetup()};s.appendChild(bk)}
}

/* ---------- BOOT ---------- */
function boot(){
  applyTheme();
  const b=E("div",null,'<div class="logo">OneOS</div><div class="bar"><i></i></div>');b.id="boot";
  $("#root").appendChild(b);
  setTimeout(()=>{b.remove();if(!S.setup)buildSetup();else{buildLock();buildHome()}},2600);
}
$("#navHome").onclick=goHome;
$("#navBack").onclick=goBack;
$("#navRec").onclick=()=>{
  const r=$("#recents");r.innerHTML="";
  const t=E("div",null,"Recents");t.style.cssText="text-align:center;font-weight:750;margin-bottom:16px";r.appendChild(t);
  const id=recent[recent.length-1];
  if(id&&APPS[id]){const a=APPS[id];
    const c=E("div","rcard",`<div class="rt"><i style="background:linear-gradient(140deg,${a.c[0]},${a.c[1]})"></i>${a.n}</div>`);
    c.onclick=()=>{r.classList.remove("on");openApp(id)};r.appendChild(c)}
  else r.appendChild(E("div","muted","No recent apps"));
  const cl=E("div","chip","Clear all");cl.style.cssText="margin:0 auto";cl.onclick=()=>{closeAll();r.classList.remove("on")};r.appendChild(cl);
  r.classList.add("on");
};
$("#aiFab").onclick=()=>openApp("ai");
$("#sb").onclick=()=>{buildCC();$("#cc").classList.add("on")};
buildHome();boot();tick();setInterval(tick,10000);
</script>
</body>
</html>
