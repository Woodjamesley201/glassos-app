<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>OneOS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
--accent:#5b8cff;--accent2:#a06bff;--bg:#05060a;--txt:#f3f5f9;--dim:#98a1b2;
--gb:rgba(255,255,255,.16);--glassbg:linear-gradient(155deg,rgba(255,255,255,.13),rgba(255,255,255,.035));
--r:24px;--isq:22px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,system-ui,sans-serif;
-webkit-font-smoothing:antialiased;user-select:none;font-size:15px}
#root{position:relative;height:100dvh;min-height:740px;max-height:1400px;overflow:hidden;isolation:isolate}
#wall{position:absolute;inset:0;z-index:0;background:
radial-gradient(120% 90% at 12% 6%,color-mix(in srgb,var(--accent) 34%,transparent),transparent 60%),
radial-gradient(110% 80% at 88% 22%,color-mix(in srgb,var(--accent2) 30%,transparent),transparent 62%),
radial-gradient(90% 70% at 50% 108%,#1b2333,transparent 70%),
linear-gradient(170deg,#070810,#0a0c16 45%,#05060a)}
#wall::after{content:"";position:absolute;inset:-30%;background:
radial-gradient(35% 30% at 30% 40%,rgba(255,255,255,.09),transparent 70%),
radial-gradient(30% 26% at 72% 62%,rgba(255,255,255,.06),transparent 70%);
filter:blur(20px);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-4%,0) scale(1.08) rotate(4deg)}}
.scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.1) 30%,rgba(0,0,0,.45))}
#stage{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column}

.glass{position:relative;background:var(--glassbg);backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);
border:1px solid var(--gb);box-shadow:0 14px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.26);border-radius:var(--r);overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;
background:linear-gradient(118deg,transparent 26%,rgba(255,255,255,.14) 42%,rgba(255,255,255,.03) 54%,transparent 74%)}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
box-shadow:inset 0 -1px 0 rgba(255,255,255,.10),inset 0 0 22px rgba(255,255,255,.04)}

#sb{position:absolute;top:0;left:0;right:0;height:46px;z-index:60;display:flex;align-items:center;justify-content:space-between;
padding:0 20px;font-size:12.5px;font-weight:650;letter-spacing:.3px;color:#fff;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#sb .r{display:flex;gap:7px;align-items:center;opacity:.95}
#sb svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.9}
.batt{width:24px;height:12px;border:1.6px solid #fff;border-radius:4px;position:relative;padding:1.6px}
.batt i{display:block;height:100%;width:86%;background:#fff;border-radius:2px}
.batt::after{content:"";position:absolute;right:-3.4px;top:3.2px;width:2px;height:4px;background:#fff;border-radius:1px}

#boot{position:absolute;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#boot .logo{font-size:30px;font-weight:800;letter-spacing:-1px;background:linear-gradient(100deg,#fff,#9ab4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot .bar{width:130px;height:3px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:#fff;animation:fill 2.4s ease forwards}
@keyframes fill{to{width:100%}}

#setup{position:absolute;inset:0;z-index:150;display:flex;flex-direction:column;padding:56px 22px 30px;overflow:auto}
.setuphead{display:flex;justify-content:center;margin-bottom:18px}
.orb{width:66px;height:66px;border-radius:50%;background:conic-gradient(from 0deg,var(--accent),var(--accent2),#4be0c8,var(--accent));
box-shadow:0 0 44px color-mix(in srgb,var(--accent) 60%,transparent);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#setup h1{font-size:27px;font-weight:800;letter-spacing:-.9px;line-height:1.15;margin-bottom:8px}
#setup p.sub{color:var(--dim);font-size:13.5px;line-height:1.55;margin-bottom:20px}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22)}
.dots i.on{background:#fff;width:16px;border-radius:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;border:0;
background:linear-gradient(140deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:15px;cursor:pointer;
box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--gb);box-shadow:none}
.btn:active{transform:scale(.975)}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;margin-bottom:9px;
background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);cursor:pointer;font-size:14px}
.opt.sel{background:color-mix(in srgb,var(--accent) 26%,transparent);border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.opt .chk{margin-left:auto;width:18px;height:18px;border-radius:50%;border:1.6px solid rgba(255,255,255,.35)}
.opt.sel .chk{background:#fff;border-color:#fff;box-shadow:inset 0 0 0 4px var(--accent)}
input.field,textarea.field{width:100%;padding:15px 16px;border-radius:16px;border:1px solid var(--gb);background:rgba(255,255,255,.06);
color:#fff;font-size:15px;font-family:inherit;outline:none}
input.field:focus,textarea.field:focus{border-color:var(--accent)}
.sw{width:48px;height:28px;border-radius:20px;background:rgba(255,255,255,.16);position:relative;flex:0 0 auto;transition:.2s;cursor:pointer}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.22s}
.sw.on{background:linear-gradient(120deg,var(--accent),var(--accent2))}
.sw.on i{left:23px}

#lock{position:absolute;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;padding-top:74px;
transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
#lock.up{transform:translateY(-100%);opacity:0;pointer-events:none}
#lock .time{font-size:96px;font-weight:250;letter-spacing:-6px;line-height:.95;font-variant-numeric:tabular-nums;
background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent}
#lock .date{color:rgba(255,255,255,.8);font-size:14px;font-weight:600;margin-top:6px}
.lockwidgets{display:flex;gap:10px;margin-top:26px}
.lw{padding:10px 14px;border-radius:18px;font-size:11.5px;color:#fff;display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.lw svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.8}
.lockbottom{margin-top:auto;margin-bottom:26px;display:flex;flex-direction:column;align-items:center;gap:16px}
.pill{width:132px;height:5px;border-radius:5px;background:rgba(255,255,255,.85)}
.hint{font-size:11.5px;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:.3px}

#home{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;padding:52px 16px 0;
transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s,filter .3s}
#home.away{transform:scale(.94);opacity:0;pointer-events:none;filter:blur(4px)}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.wcard{padding:14px;border-radius:22px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.wcard .big{font-size:26px;font-weight:750;letter-spacing:-1px}
.wcard .lbl{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.wcard.wide{grid-column:span 2}
.pages{flex:1;overflow:hidden;position:relative;touch-action:pan-y}
.page{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;align-content:start;
padding:4px 2px;overflow-y:auto;scrollbar-width:none;transition:opacity .3s}
.page::-webkit-scrollbar{display:none}
.page.off{opacity:0;pointer-events:none}
.icon{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.icon .sq{width:58px;height:58px;border-radius:var(--isq);display:flex;align-items:center;justify-content:center;
box-shadow:0 8px 22px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.3);position:relative;overflow:hidden;transition:transform .15s}
.icon .sq::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.34),transparent 52%)}
.icon:active .sq{transform:scale(.9)}
.icon .sq svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.icon .nm{font-size:10.5px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);text-align:center;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dotsrow{display:flex;gap:6px;justify-content:center;padding:8px 0}
.dotsrow i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3)}
.dotsrow i.on{background:#fff}
#dock{margin:6px 0 14px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-radius:30px}
#dock .icon .nm{display:none}
#dock .icon .sq{width:52px;height:52px;margin:0 auto}

#appLayer{position:absolute;inset:0;z-index:80;display:none}
#appLayer.on{display:block}
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(9,11,17,.86),rgba(5,6,10,.96));
backdrop-filter:blur(30px);animation:appin .32s cubic-bezier(.2,.9,.2,1)}
@keyframes appin{from{opacity:0;transform:scale(.94) translateY(18px)}}
.apphead{display:flex;align-items:center;gap:12px;padding:52px 16px 12px;border-bottom:1px solid rgba(255,255,255,.07)}
.apphead .t{font-size:19px;font-weight:750;letter-spacing:-.4px}
.apphead .back{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
background:rgba(255,255,255,.09);border:1px solid var(--gb);cursor:pointer}
.apphead .back svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2}
.appbody{flex:1;overflow-y:auto;padding:16px 16px 90px;scrollbar-width:none}
.appbody::-webkit-scrollbar{display:none}
h2.sec{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:20px 0 8px;font-weight:750}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.07);font-size:14px;cursor:pointer}
.item:active{background:rgba(255,255,255,.1)}
.item .chev{margin-left:auto;color:var(--dim);font-size:17px}
.item .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.item .ic svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:16px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);font-size:13px;font-weight:600}
.tile b{display:block;font-size:21px;margin-bottom:2px;letter-spacing:-.6px}
.muted{color:var(--dim);font-size:12.5px;line-height:1.6}

#nav{position:absolute;bottom:0;left:0;right:0;height:44px;z-index:95;display:none;align-items:center;justify-content:center;gap:56px}
#nav.on{display:flex}
#nav .nb{width:36px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.9}
#nav svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2}
#nav .homebar{width:120px;height:5px;border-radius:5px;background:rgba(255,255,255,.9);cursor:pointer}

#cc{position:absolute;inset:0;z-index:110;background:rgba(4,5,9,.55);backdrop-filter:blur(24px);
padding:60px 18px;display:none;flex-direction:column;gap:12px}
#cc.on{display:flex;animation:appin .25s ease}
.cctop{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cctile{aspect-ratio:1;border-radius:22px;display:flex;flex-direction:column;justify-content:space-between;padding:14px;
cursor:pointer;font-size:11.5px;font-weight:700}
.cctile svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8}
.cctile.act{background:linear-gradient(150deg,var(--accent),var(--accent2))}
.cctile.off2{background:rgba(255,255,255,.07);border:1px solid var(--gb)}
.cctile.off2 svg{opacity:.55}
.slider{height:46px;border-radius:23px;position:relative;overflow:hidden;display:flex;align-items:center;padding:0 16px;font-size:15px}
.slider .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.9)}
.slider .lbl{position:relative;z-index:2;mix-blend-mode:difference;color:#fff;font-weight:700}
.slider .lbl svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.slider input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;z-index:3}
.ccfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center}

#recents{position:absolute;inset:0;z-index:105;background:rgba(4,5,9,.7);backdrop-filter:blur(20px);display:none;
flex-direction:column;justify-content:center;padding:70px 20px}
#recents.on{display:flex;animation:appin .25s ease}
.rcard{width:100%;max-width:250px;aspect-ratio:3/4;border-radius:24px;margin:0 auto 18px;overflow:hidden;position:relative;
background:linear-gradient(160deg,#1a2030,#0c0f16);border:1px solid var(--gb);box-shadow:0 20px 50px rgba(0,0,0,.6);cursor:pointer}
.rcard .rt{position:absolute;top:0;left:0;right:0;padding:12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;
background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)}
.rcard .rt i{width:22px;height:22px;border-radius:7px;display:block}

#desk{position:absolute;inset:0;z-index:100;display:none;background:linear-gradient(160deg,#0a0d16,#060810 60%,#0b1018);overflow:hidden}
#desk.on{display:block}
#desk::before{content:"";position:absolute;inset:0;background:
radial-gradient(60% 50% at 20% 10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),
radial-gradient(50% 40% at 85% 80%,color-mix(in srgb,var(--accent2) 18%,transparent),transparent 70%)}
#deskIcons{position:absolute;top:26px;left:26px;display:flex;flex-direction:column;gap:18px;z-index:2}
#deskIcons .icon .nm{font-size:10px}
#taskbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:10px;
padding:9px 14px;border-radius:20px}
#taskbar .tb{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#taskbar .tb:hover{background:rgba(255,255,255,.12)}
#taskbar .tb svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.8}
.win{position:absolute;width:min(430px,88%);border-radius:16px;overflow:hidden;background:rgba(12,15,22,.94);
backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 70px rgba(0,0,0,.65);z-index:10;display:flex;flex-direction:column}
.win .wbar{display:flex;align-items:center;gap:8px;padding:9px 10px;background:rgba(255,255,255,.06);cursor:grab;border-bottom:1px solid rgba(255,255,255,.08)}
.win .wbar .wd{width:9px;height:9px;border-radius:50%}
.win .wbar .wt{font-size:11.5px;font-weight:700;margin-left:2px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win .wbar .wb{width:18px;height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.7;font-size:13px}
.win .wbody{overflow:auto;padding:12px;font-size:13px;max-height:60vh}
#startMenu{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);z-index:30;width:min(360px,90%);padding:14px;
display:none;grid-template-columns:repeat(4,1fr);gap:12px;border-radius:22px}
#startMenu.on{display:grid}

.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;background:rgba(255,255,255,.08);
border:1px solid var(--gb);font-size:11.5px;font-weight:650;cursor:pointer;margin:0 6px 6px 0}
.chip.on{background:linear-gradient(120deg,var(--accent),var(--accent2))}
.prog{height:6px;border-radius:6px;background:rgba(255,255,255,.13);overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.aiFab{position:absolute;right:16px;bottom:64px;z-index:90;width:52px;height:52px;border-radius:50%;display:none;align-items:center;
justify-content:center;cursor:pointer;background:conic-gradient(from 40deg,var(--accent),var(--accent2),#4be0c8,var(--accent));
box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 55%,transparent)}
.aiFab svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.9}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);z-index:190;padding:12px 18px;
border-radius:16px;font-size:12.5px;font-weight:650;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.reboot{position:absolute;inset:0;z-index:300;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#fff}
.reboot.on{display:flex}
.photo{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;cursor:pointer}
.msg{max-width:78%;padding:11px 14px;border-radius:18px;font-size:13.5px;line-height:1.5;margin-bottom:8px;animation:appin .2s}
.msg.me{margin-left:auto;background:linear-gradient(130deg,var(--accent),var(--accent2));border-bottom-right-radius:6px}
.msg.them{background:rgba(255,255,255,.09);border-bottom-left-radius:6px}
.dim2{color:var(--dim)}
.fade{animation:appin .3s ease}
</style>
</head>
<body>
<div id="root">
  <div id="wall"></div><div class="scrim"></div>
  <div id="stage">
    <div id="sb">
      <span id="sbTime">9:41</span>
      <span class="r">
        <svg viewBox="0 0 24 24"><path d="M4 17h2M9 13v4M14 9v8M19 5v12"/></svg>
        <svg viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0120 0M5 12a10 10 0 0114 0M8.5 15.5a5 5 0 017 0M12 19h.01"/></svg>
        <span class="batt"><i></i></span>
      </span>
    </div>
    <div id="appLayer"></div>
    <div id="home"></div>
    <div id="lock"></div>
    <div id="cc"></div>
    <div id="recents"></div>
    <div id="desk"></div>
    <div id="setup"></div>
    <div id="nav">
      <span class="nb" id="navBack"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></span>
      <span class="homebar" id="navHome"></span>
      <span class="nb" id="navRec"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></span>
    </div>
    <div class="aiFab" id="aiFab"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.4L20 10l-5.8 1.6L12 17l-2.2-5.4L4 10l5.8-1.6z"/></svg></div>
    <div class="toast glass" id="toast"></div>
    <div class="reboot" id="reboot"><div class="orb"></div><div style="font-size:13px;letter-spacing:.4px">Installing OneOS update…</div></div>
  </div>
</div>
<script>
"use strict";
const KEY="oneos.v1";
const DEF={setup:false,lang:"English (US)",wifi:null,name:"Alex",ai:true,dark:true,accent:"#5b8cff",accent2:"#a06bff",
shape:"squircle",nav:"bar",ver:"1.0.0",installed:[],bright:78,vol:60,wifiOn:true,bt:false,dnd:false,page:0,
theme:{clockFont:"thin"},notes:[{t:"Welcome to OneOS",b:"Everything you type in Notes is saved on this device.",d:Date.now()}],photos:[]};
let S=Object.assign({},DEF);
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const $=(s,r=document)=>r.querySelector(s);
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1900)}
const rnd=(a,b)=>a+Math.random()*(b-a);
function applyTheme(){
  const d=document.documentElement;
  d.style.setProperty("--accent",S.accent);d.style.setProperty("--accent2",S.accent2);
  d.style.setProperty("--isq",{squircle:"22px",round:"50%",soft:"14px",square:"6px"}[S.shape]||"22px");
}
function tick(){const d=new Date();const h=d.getHours()%12||12;
  $("#sbTime").textContent=h+":"+String(d.getMinutes()).padStart(2,"0");}

