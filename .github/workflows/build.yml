  b.appendChild(wk)});

defApp("photos","Photos",["#f472b6","#be185d"],"photos",b=>{
  const hues=[210,260,320,15,150,190,40,290];
  const g=E("div");g.style.cssText="display:grid;grid-template-columns:repeat(3,1fr);gap:6px";b.appendChild(g);
  for(let i=0;i<18;i++){const d=E("div","photo");
    const bg=`linear-gradient(${(i*37)%360}deg,hsl(${hues[i%8]} 65% 55%),hsl(${(hues[i%8]+60)%360} 60% 28%))`;
    d.style.background=bg;
    d.onclick=()=>{b.innerHTML=`<div style="aspect-ratio:3/4;border-radius:20px;background:${bg}"></div>
      <div class="muted" style="margin-top:10px;text-align:center">IMG_${1000+i}.HEIC · Today</div>`};
    g.appendChild(d)}
  S.photos.slice(-6).reverse().forEach(src=>{const d=E("img","photo");d.src=src;d.style.objectFit="cover";g.prepend(d)})});

defApp("camera","Camera",["#94a3b8","#334155"],"camera",b=>{
  b.innerHTML=`<div style="aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:#0b0f16;position:relative;border:1px solid var(--gb)">
    <video id="camv" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b95a7;font-size:12px" id="camph">Starting camera…</div></div>
    <div style="display:flex;justify-content:center;margin-top:16px"><div id="shut" style="width:66px;height:66px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.3);cursor:pointer"></div></div>`;
  const v=$("#camv",b),ph=$("#camph",b);
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(s=>{v.srcObject=s;ph.style.display="none"})
      .catch(()=>{ph.textContent="No camera — using placeholder"});
  } else ph.textContent="No camera — using placeholder";
  $("#shut",b).onclick=()=>{
    const c=document.createElement("canvas");c.width=480;c.height=640;const x=c.getContext("2d");
    if(v.videoWidth)x.drawImage(v,0,0,480,640);
    else{const gr=x.createLinearGradient(0,0,480,640);gr.addColorStop(0,"#243b55");gr.addColorStop(1,"#141e30");x.fillStyle=gr;x.fillRect(0,0,480,640)}
    S.photos.push(c.toDataURL("image/jpeg",.6));if(S.photos.length>12)S.photos.shift();save();toast("Photo saved to Photos")}});

defApp("maps","Maps",["#34d399","#047857"],"maps",b=>{
  b.innerHTML=`<div style="border-radius:20px;overflow:hidden;border:1px solid var(--gb);position:relative;height:340px;background:#0d1520">
    <canvas id="mapc" width="700" height="680" style="width:100%;height:100%"></canvas>
    <div class="glass" style="position:absolute;left:10px;right:10px;bottom:10px;padding:12px;border-radius:16px">
      <div style="font-weight:700;font-size:13px">Current location</div><div class="muted">Market St · San Francisco</div></div></div>
    <div style="display:flex;gap:8px;margin-top:12px;overflow:auto">
      <div class="chip">☕ Cafés</div><div class="chip">⛽ Gas</div><div class="chip">🛒 Groceries</div><div class="chip">🏥 Hospital</div></div>`;
  const c=$("#mapc",b),x=c.getContext("2d");
  x.fillStyle="#0d1520";x.fillRect(0,0,700,680);
  x.strokeStyle="#1c2b3d";x.lineWidth=26;
  for(let i=0;i<7;i++){x.beginPath();x.moveTo(0,i*100+40);x.lineTo(700,i*100+20);x.stroke()}
  for(let i=0;i<8;i++){x.beginPath();x.moveTo(i*95+30,0);x.lineTo(i*95+10,680);x.stroke()}
  x.strokeStyle="#2b6b52";x.lineWidth=8;x.beginPath();x.moveTo(0,520);x.lineTo(700,300);x.stroke();
  x.fillStyle="rgba(52,211,153,.22)";x.beginPath();x.arc(350,320,30,0,7);x.fill();
  x.fillStyle="#34d399";x.beginPath();x.arc(350,320,11,0,7);x.fill()});

defApp("music","Music",["#f43f5e","#9f1239"],"music",b=>{
