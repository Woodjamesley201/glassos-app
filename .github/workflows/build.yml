msg:[gr('#6df07e','#17b936'),'<ellipse cx="30" cy="29" rx="21" ry="15" fill="#fff"/>'+P('M14 40c0 4-2 7-5 9 5 0 9-2 12-5z')],
web:[gr('#35c4ff','#0a6df0'),'<circle cx="30" cy="30" r="21" fill="none" stroke="#fff" stroke-width="2.5"/>'+P('M41 19L33 33 27 27z','#ff453a')+P('M19 41L27 27 33 33z')],
