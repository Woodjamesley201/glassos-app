  const now=new Date(),y=now.getFullYear(),mo=now.getMonth();
  b.innerHTML=`<div style="font-size:17px;font-weight:750;margin-bottom:10px">${now.toLocaleString([],{month:"long"})} ${y}</div>`;
  const g=E("div");g.style.cssText="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px";b.appendChild(g);
  ["S","M","T","W","T","F","S"].forEach(d=>g.appendChild(E("div","muted",d)));
  const first=new Date(y,mo,1).getDay(),days=new Date(y,mo+1,0).getDate();
  for(let i=0;i<first;i++)g.appendChild(E("div"));
  for(let d=1;d<=days;d++){const c=E("div",null,d);
    c.style.cssText=`padding:8px 0;border-radius:10px;${d===now.getDate()?"background:linear-gradient(140deg,var(--accent),var(--accent2));font-weight:750":"background:rgba(255,255,255,.05)"}`;
    g.appendChild(c)}
  b.appendChild(E("h2","sec","Today"));
  const l=E("div","list");b.appendChild(l);
  [["10:00","Design review","#ef4444"],["13:30","Coffee with Sam","#3b82f6"],["18:00","OneOS update check","#22c55e"]].forEach(([t,n,c])=>
    l.appendChild(E("div","item",`<span style="width:3px;height:28px;border-radius:3px;background:${c}"></span>
      <div><div style="font-weight:700;font-size:13px">${n}</div><div class="muted">${t}</div></div>`)))});

