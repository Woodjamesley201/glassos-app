<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>OneOS</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<style>
:root{--ac:#0a84ff;--b:26px;--r:22.4%;--cols:4;--lw:600;--is:clamp(56px,8vw,78px);--fg:#fff;--tx:rgba(255,255,255,.62);--bg:rgba(24,24,30,.5);--wb:rgba(14,14,18,.86);--el:rgba(127,127,135,.18);--hl:rgba(255,255,255,.1);--sb:env(safe-area-inset-top,0px);--sbb:env(safe-area-inset-bottom,0px)}
body.light{--fg:#101014;--tx:rgba(0,0,0,.55);--bg:rgba(255,255,255,.5);--wb:rgba(246,246,250,.82);--hl:rgba(0,0,0,.1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{display:none}
html,body{height:100%;overflow:hidden;background:#000;color:var(--fg);font:15px/1.35 -apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
input,textarea,button{font:inherit;color:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
button{cursor:pointer}
#os{position:fixed;inset:0;overflow:hidden}
#dim{position:fixed;inset:0;background:#000;pointer-events:none;z-index:2000}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.02) 60%),var(--bg);backdrop-filter:blur(var(--b)) saturate(180%);-webkit-backdrop-filter:blur(var(--b)) saturate(180%);border:.5px solid rgba(255,255,255,.2);box-shadow:inset 0 .5px 0 rgba(255,255,255,.4),0 8px 30px rgba(0,0,0,.22)}
#st{position:absolute;top:0;left:0;right:0;z-index:900;display:flex;justify-content:space-between;padding:calc(var(--sb) + 8px) 22px 6px;font-weight:600;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer}
body.hide #si{visibility:hidden}
#home{position:absolute;inset:0;padding:calc(var(--sb) + 56px) 4vw 200px;overflow:auto}#ig{display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-auto-rows:min-content;gap:24px 4px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;cursor:pointer;text-shadow:0 1px 4px rgba(0,0,0,.5);color:#fff;text-align:center}
.ic i{width:var(--is);height:var(--is);border-radius:var(--r);display:grid;place-items:center;font-size:calc(var(--is)*.5);font-style:normal;background-image:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.7),inset 0 -2px 5px rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.3);transition:transform .15s}
.ic:active i{transform:scale(.88)}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sbb) + 16px);max-width:calc(100% - 16px);padding:10px 16px;border-radius:34px;display:flex;gap:min(2.4vw,18px);align-items:center;z-index:5}#dock .ic{font-size:0;gap:0}#dock .ic i{width:calc(var(--is)*.86);height:calc(var(--is)*.86)}@media(max-width:560px){#dock .ic:nth-child(n+5){display:none}}
#ask{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sbb) + 138px);padding:8px 22px;border-radius:30px;font-size:13px;z-index:5;cursor:pointer;color:#fff}
#wins{position:absolute;inset:0;z-index:50;pointer-events:none}
.win{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.02) 55%),var(--wb);animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.88)}}
.win.mn{display:none}
.tbar{display:none;align-items:center;gap:14px;padding:10px 14px;cursor:move;font-weight:600;touch-action:none}
.dots i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;cursor:pointer}
.bd{flex:1;overflow:auto;padding:calc(var(--sb) + 40px) 16px 44px;position:relative;-webkit-user-select:text}
.bd.fr{padding:calc(var(--sb) + 34px) 0 0;display:flex;flex-direction:column;overflow:hidden}
.bd.ch{display:flex;flex-direction:column}
body.desk .win{inset:auto;left:var(--x);top:var(--y);width:min(760px,72vw);height:min(500px,64vh);border-radius:22px}
body.desk .win.mx{left:0;top:34px;width:100%;height:calc(100% - 104px);border-radius:0}
body.desk .tbar{display:flex}
body.desk .bd{padding:6px 16px 16px}
body.desk .bd.fr{padding:0}
body.desk #ig{grid-template-columns:repeat(auto-fill,88px);gap:14px 6px;justify-content:start}body.desk #home{padding:48px 18px 90px}body.desk #wg{display:none}
body.desk .ic i{width:50px;height:50px;font-size:25px}
body.desk #dock,body.desk #ask,body.desk #pill{display:none}
#tb{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:12px;height:52px;padding:0 12px;border-radius:28px;align-items:center;gap:8px;z-index:800}
body.desk #tb{display:flex}
#tb button{background:none;border:0;font-size:22px;border-radius:12px;padding:4px 8px}
#tb button.act{background:rgba(255,255,255,.25)}
#tbc{font-size:13px;font-weight:600;margin-left:8px}
#lnch{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:76px;width:min(520px,94vw);max-height:60%;overflow:auto;border-radius:30px;padding:20px;grid-template-columns:repeat(4,1fr);gap:16px;z-index:790}
#lnch.on{display:grid}
#pill{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sbb) + 6px);width:140px;height:22px;z-index:900;cursor:pointer}
#pill::after{content:"";position:absolute;left:5px;right:5px;top:8px;height:5px;border-radius:3px;background:var(--fg);opacity:.65}
#cc{display:none;position:absolute;left:12px;right:12px;top:calc(var(--sb) + 40px);z-index:950;border-radius:30px;padding:16px;grid-template-columns:repeat(4,1fr);gap:10px}
#cc.on{display:grid}
@media(min-width:700px){#cc{left:auto;width:340px}}
#cc input{grid-column:1/-1}
.tl{aspect-ratio:1;border-radius:22px;display:grid;place-items:center;font-size:24px;cursor:pointer;background:var(--el)}
.tl.on{background:var(--ac)}
#lock{position:absolute;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--sb) + 90px);background:rgba(0,0,0,.06);transition:transform .55s cubic-bezier(.7,0,.3,1);cursor:pointer;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.3)}
#lock.up{transform:translateY(-105%)}
#lt{font-size:min(34vh,30vw);font-weight:var(--lw);letter-spacing:-.03em;line-height:.95;transform:scaleY(1.18);transform-origin:top;margin-top:2vh;text-shadow:none;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.18));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.5)}
#ld{font-size:19px;font-weight:600;opacity:.9}
#lock p{position:absolute;bottom:calc(var(--sbb) + 14px);width:230px;height:5px;border-radius:3px;background:rgba(255,255,255,.85)}
h1{font-size:30px;font-weight:700;margin:4px 0 14px}
h3{font-size:15px;margin-top:10px}
.tx,small{color:var(--tx)}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;margin-bottom:8px;border-radius:18px;background:var(--el);cursor:pointer}
.row b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--ac);font-weight:400;flex:none}
.row span{flex:1}.row em{font-style:normal;color:var(--tx)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:20px;padding:8px 18px;font-weight:600}
.in{width:100%;background:var(--el);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 14px;outline:0;margin-bottom:10px}
.sw{width:48px;height:29px;border-radius:15px;background:var(--el);position:relative;transition:.25s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.sw.on{background:#34c759}.sw.on::after{left:21px}
.card{border-radius:22px;padding:14px;margin-bottom:12px}
.card>*{margin-top:8px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:8px;border:0;border-radius:12px;background:var(--el)}
.sw2,.wps{display:flex;gap:10px;flex-wrap:wrap}
.sw2 i,.wps i{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.6);cursor:pointer}
.wps i{border-radius:12px;width:60px;height:44px}
input[type=range]{width:100%;accent-color:var(--ac)}
.bk{color:var(--ac);font-weight:600;cursor:pointer;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 2px;border-bottom:1px solid var(--el);font-size:14px}
.kv span:last-child{color:var(--tx);text-align:right;word-break:break-word}
.ctr{text-align:center;padding-top:16px}.big{font-size:56px;font-weight:300}
.pb{height:6px;border-radius:3px;background:var(--el);margin:16px auto;max-width:260px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:var(--ac);transition:width .1s}
.ms{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.bb{max-width:80%;padding:9px 14px;border-radius:20px;background:var(--el)}
.bb.r{align-self:flex-end;background:var(--ac);color:#fff}
.cr{display:flex;gap:8px;margin-top:10px;flex:none}.cr .in{margin:0;flex:1}
.cd{font-size:54px;text-align:right;padding:24px 8px;min-height:110px;overflow:hidden;font-weight:300}
.ck,.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ck button{aspect-ratio:1.25;border:0;border-radius:50px;font-size:24px;background:var(--el)}
.ck .op{background:#ff9f0a;color:#fff}
.pad{grid-template-columns:repeat(3,1fr);max-width:300px;margin:0 auto 14px}
.pad button{aspect-ratio:1.4;border:0;border-radius:40px;font-size:26px;background:var(--el)}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gg>*{aspect-ratio:1;object-fit:cover;border-radius:10px;width:100%}
.bar{display:flex;gap:6px;padding:6px;margin:0 8px 6px;border-radius:22px;flex:none}
.bar button{background:none;border:0;font-size:20px;padding:0 8px}
.bar .in{margin:0;padding:6px 12px}
#bv{flex:1;min-height:0;overflow:auto}
#bv iframe,.bd.fr>iframe{width:100%;height:100%;border:0;background:#fff}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.tiles div{padding:20px;border-radius:18px;background:var(--el);text-align:center;cursor:pointer}
.shot{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.5)}
#wg{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:26px}
.wd{width:min(150px,27vw);height:min(150px,27vw);border-radius:26px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;cursor:pointer;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.05) 60%),rgba(28,28,40,.4)}
.wd.wide{width:min(314px,56vw);justify-content:flex-start;gap:6px}
.wd b{font-size:min(54px,10vw);font-weight:300;line-height:1}
.wd small{color:#ff453a;font-weight:700}.wd.wide small{color:#ffd60a}
.wd p{font-size:14px;line-height:1.3;overflow:hidden;opacity:.92}
.wd svg{width:100%;height:100%}
.ring{width:min(84px,16vw);height:min(84px,16vw);border-radius:50%;background:conic-gradient(#ffd60a var(--p),rgba(255,255,255,.25) 0);display:grid;place-items:center;margin:auto}
.ring span{width:78%;height:78%;border-radius:50%;background:rgba(30,30,40,.6);display:grid;place-items:center;font-size:14px;font-weight:600}
#pg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sbb) + 112px);display:flex;gap:8px;z-index:5}
#pg i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}#pg i:first-child{background:#fff}
body.desk #pg{display:none}
#tm b{font-weight:700;margin-right:10px}#tm span{font-weight:500}
#si{display:flex;align-items:center;gap:6px}
.bt{display:inline-block;width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1px}.bt i{display:block;height:100%;background:currentColor;border-radius:2px}
.wps i,.gg>div{background-size:cover!important;background-position:center!important}
.ai{display:block;overflow:hidden;border-radius:var(--r)}
.ai svg{width:100%;height:100%;display:block}
.ic i{background-image:none;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18),0 3px 10px rgba(0,0,0,.3)}
.ic{font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.row{background:none;border-radius:0;border-bottom:.5px solid var(--hl);padding:14px 2px;margin:0}
.row .ai{width:46px;height:46px;flex:none}
.tl{aspect-ratio:auto;height:52px;border-radius:16px;font-size:12px;font-weight:600}
#tb button{padding:3px}#tb .ai{width:36px;height:36px}
.wd{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 60%),rgba(24,24,30,.5);border-radius:24px}
.win{background:var(--wb)}
h1{font-size:28px;letter-spacing:-.02em;font-weight:700}
#st{text-shadow:none}
body:not(.light) #os::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3);pointer-events:none}
</style></head><body>
<div id=os>
<div id=st onclick="$('#cc').classList.toggle('on')"><span id=tm></span><span id=si></span></div>
<div id=home></div><div id=pg><i></i><i></i><i></i></div>

<div id=dock class=glass></div>
<div id=lnch class=glass></div>
<div id=wins></div>
<div id=tb class=glass><button onclick="$('#lnch').classList.toggle('on')">▦</button><span id=tbw></span><span id=tbc></span></div>
<div id=pill></div>
<div id=cc class=glass></div>
<div id=lock onclick="this.classList.add('up')"><div id=ld></div><div id=lt></div><p></p></div>
</div><div id=dim></div>
