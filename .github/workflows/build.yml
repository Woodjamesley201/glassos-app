<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a4a">
<title>GlassOS</title>
<style>
:root{--blur:26px;--tint:.16;--txt:#fff;--sub:rgba(255,255,255,.72);--ink:#14161c;--sheet:rgba(250,250,252,.94)}
@media (prefers-color-scheme:dark){:root{--ink:#f2f3f7;--sheet:rgba(24,26,34,.93)}}
:root[data-theme=light]{--ink:#14161c;--sheet:rgba(250,250,252,.94)}
:root[data-theme=dark]{--ink:#f2f3f7;--sheet:rgba(24,26,34,.93)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:#0d1224;font-family:-apple-system,"SF Pro Display","Roboto","Segoe UI",sans-serif;color:var(--txt)}
#wall{position:fixed;inset:0;background:var(--wp,linear-gradient(160deg,#2a3f8f,#6b3fa0 50%,#e0678b));transition:background .6s}
#wall i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 18s ease-in-out infinite alternate}
#wall i:nth-child(1){width:55vmax;height:55vmax;left:-12vmax;top:-10vmax;background:var(--b1,#4cc9f0)}
#wall i:nth-child(2){width:45vmax;height:45vmax;right:-10vmax;bottom:-12vmax;background:var(--b2,#ff9e6d);animation-delay:-6s}
#wall i:nth-child(3){width:30vmax;height:30vmax;left:40%;top:30%;background:var(--b3,#9d4edd);animation-delay:-11s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.glass{position:relative;background:rgba(255,255,255,var(--tint));backdrop-filter:blur(var(--blur)) saturate(190%) brightness(1.08);-webkit-backdrop-filter:blur(var(--blur)) saturate(190%) brightness(1.08);border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(255,255,255,.12),inset 0 0 22px rgba(255,255,255,.07),0 14px 36px rgba(8,10,30,.28)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.38),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.14))}
#desk{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);display:flex;flex-direction:column}
#bar{display:flex;justify-content:space-between;align-items:center;padding:8px 26px;font-size:14px;font-weight:600}
#bar span:last-child{display:flex;gap:8px;align-items:center}
.batt{width:26px;height:12px;border-radius:4px;border:1.5px solid var(--sub);position:relative}
.batt::after{content:"";position:absolute;inset:1.5px 6px 1.5px 1.5px;background:#fff;border-radius:2px}
#home{flex:1;overflow:auto;padding:12px 5vw 150px;display:flex;flex-direction:column;gap:26px;scrollbar-width:none}
#widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;max-width:900px;width:100%;margin:0 auto}
.wd{border-radius:28px;padding:18px 20px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.wd small{font-size:13px;color:var(--sub);font-weight:600}
.big{font-size:44px;font-weight:300;letter-spacing:-1px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:26px 10px;max-width:900px;width:100%;margin:0 auto}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.ic{width:70px;height:70px;border-radius:17px;display:grid;place-items:center;font-size:34px;position:relative;overflow:hidden;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.28);transition:transform .15s}
.ic::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.45),rgba(255,255,255,0) 50%)}
.app:active .ic{transform:scale(.9)}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:18px;padding:12px 16px;border-radius:34px;z-index:5}
#dock .app span{display:none}
#win{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;background:var(--sheet);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);color:var(--ink);padding-top:env(safe-area-inset-top,0px)}
#win.open{display:flex;animation:zoom .5s cubic-bezier(.2,.9,.25,1)}
#win.closing{animation:zoomout .36s cubic-bezier(.4,0,.7,.2) forwards}
@keyframes zoom{0%{transform:scale(.1);opacity:0;border-radius:48px}55%{opacity:1}100%{transform:none;opacity:1;border-radius:0}}
@keyframes zoomout{to{transform:scale(.1);opacity:0;border-radius:48px}}
#wh{padding:14px 24px 6px;font-size:22px;font-weight:700}
#wb{flex:1;overflow:auto;padding:8px 24px 40px;user-select:text}
#pill{align-self:center;width:150px;height:6px;border-radius:3px;background:var(--ink);opacity:.4;margin:8px 0 calc(8px + env(safe-area-inset-bottom,0px));cursor:pointer;flex:none;padding:0;border:0}
textarea{width:100%;height:100%;min-height:60vh;border:0;background:transparent;color:var(--ink);font:18px/1.5 inherit;font-family:inherit;outline:none;resize:none}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:0 auto}
.calc .o{grid-column:1/-1;text-align:right;font-size:56px;font-weight:300;padding:10px 6px;overflow:hidden;white-space:nowrap}
.calc button{height:68px;border-radius:34px;border:0;font-size:26px;background:rgba(128,128,140,.22);color:var(--ink);font-family:inherit}
.calc button.op{background:#ff9f0a;color:#fff}
.calc button:active{filter:brightness(1.3)}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid rgba(128,128,140,.25);gap:16px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:56px;height:56px;border-radius:14px;border:2px solid transparent;cursor:pointer}
.sw button.on{border-color:var(--ink)}
.seg button{padding:8px 14px;border-radius:10px;border:0;background:rgba(128,128,140,.22);color:var(--ink);font-family:inherit;font-size:15px}
input[type=range]{width:50%}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.ph div{aspect-ratio:1;border-radius:8px}
#toast{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);opacity:0;padding:12px 22px;border-radius:24px;z-index:30;font-size:15px;transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
input,textarea{user-select:text;-webkit-user-select:text}
.sb{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:2px 10px;font-size:15px;margin-left:10px}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50}
#cc{position:fixed;right:14px;top:calc(48px + env(safe-area-inset-top,0px));width:min(340px,92vw);border-radius:32px;padding:18px;z-index:25;opacity:0;transform:scale(.9) translateY(-10px);transform-origin:top right;pointer-events:none;transition:.25s;color:#fff}
#cc.on{opacity:1;transform:none;pointer-events:auto}
.ccg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.ccg button{height:72px;border-radius:22px;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit}
.ccg button small{font-size:12px}
#rec{position:fixed;inset:0;z-index:22;display:none;flex-direction:column;justify-content:center;background:rgba(10,12,30,.35);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);color:#fff}
#rec.on{display:flex}
.rc{flex:none;width:190px;height:250px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer}
.rc button{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:15px;border:0;background:rgba(255,255,255,.25);color:#fff;z-index:1}
#win.split{right:50%}
#win2{position:fixed;top:0;bottom:0;left:50%;right:0;z-index:20;display:none;flex-direction:column;background:var(--sheet);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);color:var(--ink);padding-top:env(safe-area-inset-top,0px);border-left:1px solid rgba(128,128,140,.35)}
#win2.open{display:flex}
#wh2{padding:14px 24px 6px;font-size:22px;font-weight:700}
#wb2{flex:1;overflow:auto;padding:8px 24px 40px;user-select:text}
#pill2{align-self:center;width:110px;height:6px;border-radius:3px;background:var(--ink);opacity:.4;margin:8px 0 calc(8px + env(safe-area-inset-bottom,0px));cursor:pointer;flex:none;padding:0;border:0}
#sp{max-width:900px;width:100%;margin:0 auto;border-radius:24px;padding:14px 20px;color:var(--sub);cursor:pointer;font-size:17px}
#spot{position:fixed;inset:0;z-index:26;display:none;background:rgba(10,12,30,.4);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:calc(60px + env(safe-area-inset-top,0px)) 5vw 0}
#spot.on{display:block}
#spb{max-width:620px;margin:0 auto;border-radius:28px;padding:14px;color:#fff}
#spi{width:100%;height:50px;border-radius:25px;border:0;background:rgba(255,255,255,.2);color:#fff;padding:0 20px;font-size:18px;outline:none;font-family:inherit;margin-bottom:8px}
#spi::placeholder{color:rgba(255,255,255,.7)}
.res{padding:13px 14px;border-radius:14px;cursor:pointer;font-size:17px}
.res:active{background:rgba(255,255,255,.18)}
#lock{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(10,12,30,.15);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none;color:#fff;transition:transform .4s cubic-bezier(.2,.9,.25,1),opacity .4s}
#lock.off{transform:translateY(-100%);opacity:0;pointer-events:none}
#lkt{font-size:min(24vw,150px);font-weight:200;letter-spacing:-3px;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.25)}
#lkd{font-size:22px;text-shadow:0 2px 12px rgba(0,0,0,.3)}
#lkh{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom,0px));padding:10px 26px;border-radius:24px;font-size:16px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
#desk,#dock{transition:transform .5s cubic-bezier(.2,.9,.25,1),filter .5s,opacity .5s}
body.inapp #desk{transform:scale(.92);filter:blur(10px);opacity:.5}
body.inapp #dock{transform:translateX(-50%) translateY(40px) scale(.9);opacity:0}
.wb{height:50px;min-width:50px;border-radius:25px;border:0;background:rgba(128,128,140,.25);color:var(--ink);font-size:17px;font-family:inherit;padding:0 18px;cursor:pointer}
#setup{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:rgba(8,10,28,.55);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
#setup.on{opacity:1;visibility:visible}
#sc{position:relative;width:min(520px,92vw);height:min(560px,86vh);border-radius:40px;color:#fff}
.step{position:absolute;inset:0 0 100px;padding:0 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;opacity:0;transform:translateX(40px);pointer-events:none;transition:.45s cubic-bezier(.2,.9,.25,1)}
.step.cur{opacity:1;transform:none;pointer-events:auto}
.step.past{transform:translateX(-40px)}
.step h2{margin:0;font-size:30px;font-weight:600}
.step p{margin:0;opacity:.85;max-width:340px;line-height:1.5}
#hw{font-size:64px;font-weight:300;transition:opacity .3s}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,rgba(255,255,255,.55) 14%,rgba(120,170,255,.55) 42%,rgba(120,60,200,.85) 100%);box-shadow:inset 0 0 22px rgba(255,255,255,.55),0 20px 50px rgba(60,40,160,.5);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
#sname{height:54px;width:min(340px,80%);border-radius:27px;border:0;background:rgba(255,255,255,.22);color:#fff;padding:0 22px;font-size:19px;text-align:center;outline:none;font-family:inherit}
#sname::placeholder{color:rgba(255,255,255,.7)}
#setup .seg{display:flex;gap:10px}
#setup .seg button{color:#fff;background:rgba(255,255,255,.22);padding:12px 20px;font-size:17px}
#setup .seg button.on{background:#0a84ff}
#setup .sw{justify-content:center}
#setup .sw button.on{border-color:#fff}
#sbar{position:absolute;left:30px;right:30px;bottom:26px;display:flex;justify-content:space-between}
#sbar button{height:50px;padding:0 26px;border-radius:25px;border:0;font-size:17px;background:rgba(255,255,255,.22);color:#fff;font-family:inherit}
#sbar #sn{background:#0a84ff}
#cm{position:fixed;z-index:28;min-width:190px;border-radius:22px;padding:6px;color:#fff;opacity:0;transform:scale(.85);transform-origin:top center;pointer-events:none;transition:.18s}
#cm.on{opacity:1;transform:none;pointer-events:auto}
#cm button{display:block;width:100%;text-align:left;padding:13px 16px;border:0;border-radius:16px;background:none;color:#fff;font-size:17px;font-family:inherit}
#cm button.red{color:#ff7b7b}
#cm button:active{background:rgba(255,255,255,.2)}
.ic{width:74px;height:74px;border-radius:23%;isolation:isolate;font-size:36px;text-shadow:0 2px 3px rgba(0,0,0,.28);box-shadow:0 10px 22px rgba(0,0,0,.28),0 2px 4px rgba(0,0,0,.2)}
@supports (corner-shape:squircle){.ic{corner-shape:squircle;border-radius:36%}}
.ic::before{content:"";position:absolute;inset:11%;border-radius:30%;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 3px rgba(255,255,255,.18),0 4px 8px rgba(0,0,0,.18)}
.ic::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 22%,rgba(255,255,255,0) 78%,rgba(255,255,255,.22));box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -1.5px 1px rgba(255,255,255,.25)}
#dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:35;width:min(340px,86vw);border-radius:28px;padding:22px;text-align:center;color:#fff;opacity:0;pointer-events:none;transition:.2s}
#dlg.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
#dlg p{margin:0 0 16px;line-height:1.5}
#dlg button{display:block;width:100%;height:46px;margin-top:8px;border-radius:23px;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:17px;font-family:inherit}
#dlg button:first-of-type{background:#0a84ff}
.fw{position:fixed;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;background:var(--sheet);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);color:var(--ink);border:1px solid rgba(255,255,255,.28);box-shadow:0 20px 50px rgba(5,8,25,.4);transition:left .3s,top .3s,width .3s,height .3s,border-radius .3s}
.fw.dr{transition:none}
.fw.max{border-radius:0;border:0}
.tb{height:46px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;font-weight:700;font-size:17px;touch-action:none;cursor:grab}
.fw.max .tb{height:calc(46px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.tl{position:absolute;top:15px;width:16px;height:16px;border-radius:50%;cursor:pointer}
.fw.max .tl{top:calc(15px + env(safe-area-inset-top,0px))}
.tl::after{content:"";position:absolute;inset:-10px}
.tl.r{left:16px;background:#ff5f57}.tl.g{left:44px;background:#28c840}
.wbody{flex:1;overflow:auto;padding:4px 22px 30px;user-select:text}
.rz{position:absolute;right:0;bottom:0;width:32px;height:32px;touch-action:none;background:linear-gradient(135deg,transparent 52%,rgba(128,128,140,.7) 52%,rgba(128,128,140,.7) 60%,transparent 60%,transparent 72%,rgba(128,128,140,.7) 72%,rgba(128,128,140,.7) 80%,transparent 80%)}
.fw.max .rz{display:none}
.fw iframe[style*="100vh"]{height:calc(100% - 66px)!important}
.fw textarea{height:calc(100% - 10px);min-height:200px}
.seg button.on{background:#0a84ff;color:#fff}
.tabs{display:flex;gap:6px;padding:5px;border-radius:24px;margin:0 auto 16px;max-width:440px;background:rgba(128,128,140,.2)}
.tabs button{flex:1;height:38px;border-radius:19px;border:0;background:none;color:var(--ink);font-size:15px;font-family:inherit}
.tabs button.on{background:rgba(128,128,140,.38)}
.hero{border-radius:26px;padding:22px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:18px}
.hero h2{margin:4px 0 6px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 22px}
.sapp{display:flex;align-items:center;gap:12px;padding:10px 0}
.sapp .ic{width:56px;height:56px;font-size:28px;flex:none}
.sapp>div{flex:1;min-width:0}.sapp small{opacity:.65;display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sapp .go{height:34px;padding:0 16px;border-radius:17px;border:0;background:rgba(10,132,255,.2);color:#0a84ff;font-weight:700;font-size:14px;font-family:inherit}
.sapp .go.q{background:none;color:var(--ink);opacity:.7}
#pad{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(10,12,30,.55);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
#pad.on{display:flex}
#pk{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
#pk button{height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:28px;font-family:inherit}
#pd{font-size:26px;letter-spacing:10px}
#pad .wb{color:#fff}
.ic{border-radius:23%;font-size:38px;text-shadow:0 2px 4px rgba(0,0,0,.25);box-shadow:0 6px 14px rgba(0,0,0,.28),0 1px 3px rgba(0,0,0,.22)}
@supports (corner-shape:squircle){.ic{corner-shape:round;border-radius:23%}}
.ic::before{inset:0;border-radius:inherit;background:radial-gradient(120% 70% at 50% -5%,rgba(255,255,255,.5),rgba(255,255,255,0) 62%);box-shadow:none}
.ic::after{inset:0;border-radius:inherit;background:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 5px rgba(0,0,0,.14)}
.tl.y{left:44px;background:#febc2e}.tl.g{left:72px}
.fw.min{display:none}
#gdbar{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:24;display:none;align-items:center;gap:8px;padding:0 14px;border-radius:0;border-width:1px 0 0;color:#fff}
body.gd #gdbar{display:flex}
body.gd #bar,body.gd #dock,body.gd #widgets,body.gd #sp{display:none}
body.gd #home{padding:22px 20px 20px}
body.gd #desk{padding-bottom:56px}
body.gd .grid{max-width:none;width:auto;margin:0;height:calc(100vh - 56px - 44px);grid-template-columns:none;grid-template-rows:repeat(auto-fill,100px);grid-auto-flow:column;grid-auto-columns:104px;gap:8px;align-content:start;justify-content:start}
body.gd .grid .ic{width:58px;height:58px;font-size:30px}
body.gd .grid .app{font-size:12px}
body.gd.inapp #desk{transform:none;filter:none;opacity:1}
body.gd #cc{top:auto;bottom:66px;right:14px;transform-origin:bottom right}
#gstart{flex:none;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 32% 28%,#fff 0,rgba(255,255,255,.55) 14%,rgba(120,170,255,.55) 42%,rgba(120,60,200,.85) 100%);box-shadow:inset 0 0 8px rgba(255,255,255,.6),0 4px 10px rgba(0,0,0,.3)}
#gtasks{flex:1;display:flex;gap:6px;align-items:center;padding-left:8px;overflow:hidden}
.tk{position:relative;width:48px;height:44px;border-radius:12px;border:0;background:none;display:grid;place-items:center;cursor:pointer}
.tk .ic{width:36px;height:36px;font-size:19px;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.tk.open::after{content:"";position:absolute;bottom:1px;width:6px;height:4px;border-radius:2px;background:rgba(255,255,255,.7)}
.tk.act{background:rgba(255,255,255,.22)}
.tk.act::after{width:16px;background:#fff}
#gtray{display:flex;align-items:center;gap:12px;padding:6px 12px;border-radius:12px;cursor:pointer;font-size:13px;text-align:right;line-height:1.25}
#gmenu{position:fixed;left:10px;bottom:66px;width:min(540px,92vw);height:min(580px,72vh);z-index:24;border-radius:24px;padding:16px;display:none;flex-direction:column;color:#fff}
#gmenu.on{display:flex}
