/* ---------- APPS ---------- */
const APPS={};
const defApp=(id,n,c,ic,fn)=>APPS[id]={id,n,c,ic,fn};

defApp("files","Files",["#3ba9ff","#1668d6"],"files",b=>{
  let cwd="/OneOS";
  const get=()=>JSON.parse(localStorage.getItem("oneos.fs")||"null")||{
    "/OneOS":[{n:"Documents",d:true},{n:"Pictures",d:true},{n:"Downloads",d:true},{n:"readme.txt",d:false,b:"Welcome to OneOS Files. Everything lives on your device."}],
    "/OneOS/Documents":[{n:"notes.txt",d:false,b:"Sample document."}],"/OneOS/Pictures":[],"/OneOS/Downloads":[]};
  let fs=get();const put=()=>localStorage.setItem("oneos.fs",JSON.stringify(fs));
  const draw=()=>{b.innerHTML="";
    b.appendChild(E("div","muted",`<b style="color:#fff">${cwd}</b>`));
    if(cwd!=="/OneOS"){const up=E("div","item",`<span class="ic" style="background:#3a3f4b">${ico("back")}</span>Up`);
      up.onclick=()=>{cwd=cwd.split("/").slice(0,-1).join("/")||"/OneOS";draw()};b.appendChild(up)}
    const list=E("div","list");b.appendChild(list);
    (fs[cwd]||[]).forEach(f=>{
      const it=E("div","item",`<span class="ic" style="background:${f.d?"#c99a2e":"#3a4250"}">${ico(f.d?"files":"notes")}</span><span>${f.n}</span><span class="chev">›</span>`);
      it.onclick=()=>{if(f.d){cwd+="/"+f.n;if(!fs[cwd])fs[cwd]=[];put();draw()}
        else{S.notes.unshift({t:f.n,b:f.b||"",d:Date.now()});save();toast("Opened in Notes");openApp("notes")}};
      list.appendChild(it)});
    if(!(fs[cwd]||[]).length)b.appendChild(E("div","muted","This folder is empty."));
    const bar=E("div");bar.style.cssText="display:flex;gap:8px;margin-top:14px";
    const mk=(label,dir)=>{const x=E("div","chip",label);x.onclick=()=>{const nm=prompt(dir?"Folder name":"File name");if(!nm)return;
      (fs[cwd]=fs[cwd]||[]).push({n:nm,d:dir,b:dir?undefined:"New file"});put();draw()};bar.appendChild(x)};
    mk("+ Folder",true);mk("+ File",false);b.appendChild(bar)};
  draw()});

defApp("notes","Notes",["#f7c948","#e0a015"],"notes",b=>{
  const list=()=>{b.innerHTML="";
    const add=E("div","chip","+ New note");add.onclick=()=>editor({t:"",b:"",d:Date.now()});b.appendChild(add);
    const l=E("div","list");l.style.marginTop="10px";b.appendChild(l);
    S.notes.forEach((n,i)=>{const it=E("div","item",`<div style="flex:1;overflow:hidden"><div style="font-weight:700">${n.t||"Untitled"}</div>
      <div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${(n.b||"").slice(0,44)||"Empty note"}</div></div>`);
      it.onclick=()=>editor(n,i);l.appendChild(it)})};
  const editor=(n,i)=>{b.innerHTML="";
    const t=E("input","field");t.value=n.t;t.placeholder="Title";t.style.marginBottom="10px";b.appendChild(t);
    const a=E("textarea","field");a.value=n.b;a.placeholder="Start writing…";a.style.cssText="min-height:230px;resize:none;line-height:1.6";b.appendChild(a);
    const row=E("div");row.style.cssText="display:flex;gap:8px;margin-top:12px";
    const sv=E("div","chip","Save");sv.onclick=()=>{n.t=t.value||"Untitled";n.b=a.value;n.d=Date.now();
      if(i==null)S.notes.unshift(n);save();toast("Note saved");list()};
    const del=E("div","chip","Delete");del.onclick=()=>{if(i!=null)S.notes.splice(i,1);else S.notes=S.notes.filter(x=>x!==n);save();list()};
    const bk=E("div","chip","‹ Back");bk.onclick=list;
    row.append(sv,del,bk);b.appendChild(row)};
  list()});

defApp("reminders","Reminders",["#ff6b6b","#d92b2b"],"reminders",b=>{
  let r=JSON.parse(localStorage.getItem("oneos.rem")||'[{"t":"Update OneOS","d":false},{"t":"Try OneDesk","d":true}]');
  const put=()=>localStorage.setItem("oneos.rem",JSON.stringify(r));
  const draw=()=>{b.innerHTML="";const l=E("div","list");b.appendChild(l);
    r.forEach(x=>{const it=E("div","item",`<span class="ic" style="background:${x.d?"#2f8f5b":"#ff6b6b"}">${x.d?"✓":""}</span>
      <span style="flex:1;${x.d?"text-decoration:line-through;opacity:.5":""}">${x.t}</span>`);
      it.onclick=()=>{x.d=!x.d;put();draw()};l.appendChild(it)});
    const add=E("div","chip","+ New reminder");add.onclick=()=>{const t=prompt("Reminder");if(t){r.push({t,d:false});put();draw()}};b.appendChild(add)};
  draw()});

defApp("calc","Calculator",["#6b7480","#3a414c"],"calc",b=>{
  b.innerHTML='<div style="display:flex;flex-direction:column;gap:12px"><div id="cdisp" style="font-size:44px;font-weight:250;text-align:right;padding:10px;letter-spacing:-2px">0</div><div id="cgrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:9px"></div></div>';
  const disp=$("#cdisp",b);let cur="0",prev=null,op=null;
  ["AC","±","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","0",".","⌫","="].forEach(k=>{
    const btn=E("div",null,k);
    btn.style.cssText=`padding:16px 0;text-align:center;border-radius:16px;font-size:19px;font-weight:600;cursor:pointer;background:${"÷×−+=".includes(k)?"linear-gradient(140deg,var(--accent),var(--accent2))":"rgba(255,255,255,.09)"}`;
    btn.onclick=()=>{
      if(k==="AC"){cur="0";prev=null;op=null}
      else if(k==="⌫")cur=cur.length>1?cur.slice(0,-1):"0";
      else if(k==="±")cur=String(-parseFloat(cur));
      else if(k==="%")cur=String(parseFloat(cur)/100);
      else if("÷×−+".includes(k)){prev=parseFloat(cur);op=k;cur="0"}
      else if(k==="="){const a=prev,n=parseFloat(cur);let r=0;
        if(op==="+")r=a+n;if(op==="−")r=a-n;if(op==="×")r=a*n;if(op==="÷")r=a/n;
        cur=String(Math.round(r*1e10)/1e10);prev=null;op=null}
      else cur=cur==="0"?k:cur+k;
      disp.textContent=cur};
    $("#cgrid",b).appendChild(btn)})});

defApp("clock","Clock",["#4b5563","#232a33"],"clock",b=>{
  const t=E("div");t.style.cssText="text-align:center;font-size:52px;font-weight:250;letter-spacing:-2px;font-variant-numeric:tabular-nums";b.appendChild(t);
  const d=E("div","muted");d.style.textAlign="center";b.appendChild(d);
  const up=()=>{const n=new Date();t.textContent=n.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});d.textContent=n.toDateString()};
  up();setInterval(up,1000);
  b.appendChild(E("h2","sec","World clock"));
  const l=E("div","list");b.appendChild(l);
  [["Cupertino","America/Los_Angeles"],["London","Europe/London"],["Tokyo","Asia/Tokyo"],["Seoul","Asia/Seoul"]].forEach(([c,tz])=>{
    l.appendChild(E("div","item",`<span style="flex:1">${c}</span><span class="muted">${new Date().toLocaleTimeString([],{timeZone:tz,hour:"2-digit",minute:"2-digit"})}</span>`))});
  let run=false,ms=0;const sw=E("div","chip","Start stopwatch");
  sw.onclick=()=>{run=!run;sw.textContent=run?"Stop":"Start stopwatch";sw.classList.toggle("on",run)};
  b.appendChild(sw);const out=E("div","muted");out.style.marginTop="8px";b.appendChild(out);
  setInterval(()=>{if(run){ms+=100;out.textContent=(ms/1000).toFixed(1)+"s"}},100)});

