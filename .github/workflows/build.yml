<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OneOS</title>
    <link rel="stylesheet" href="css/oneos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Lock Screen -->
    <div id="lockScreen" class="lock-screen active">
        <div class="lock-bg"></div>
        <div class="lock-content">
            <div class="lock-time">
                <div class="time-large" id="lockTime">9:41</div>
                <div class="date-large" id="lockDate">Tuesday, October 27</div>
            </div>
            <div class="lock-bottom">
                <div class="lock-hint">Swipe up to unlock</div>
                <div class="lock-indicators">
                    <div class="indicator"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Home Screen -->
    <div id="homeScreen" class="home-screen">
        <div class="status-bar">
            <div class="status-left">
                <span id="carrier">OneOS</span>
            </div>
            <div class="status-right">
                <span class="status-icon">📶</span>
                <span class="status-icon">🔋</span>
                <span id="statusTime">9:41</span>
            </div>
        </div>

        <div class="home-content" id="homeContent">
            <div class="widget-area">
                <div class="widget glass">
                    <div class="widget-header">
                        <span>Weather</span>
                        <span>Cupertino</span>
                    </div>
                    <div class="widget-body">
                        <div class="weather-temp">72°</div>
                        <div class="weather-desc">Partly Cloudy</div>
                    </div>
                </div>
                <div class="widget glass">
                    <div class="widget-header">
                        <span>Calendar</span>
                    </div>
                    <div class="widget-body">
                        <div class="calendar-event">
                            <div class="event-time">10:00 AM</div>
                            <div class="event-title">Team Meeting</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="app-grid" id="appGrid">
                <!-- Apps will be generated by JS -->
            </div>
        </div>

        <div class="dock-container">
            <div class="dock glass">
                <div class="dock-app" data-app="safari" title="Safari">
                    <div class="app-icon safari-icon">🌐</div>
                </div>
                <div class="dock-app" data-app="mail" title="Mail">
                    <div class="app-icon mail-icon">✉️</div>
                </div>
                <div class="dock-app" data-app="messages" title="Messages">
                    <div class="app-icon messages-icon">💬</div>
                </div>
                <div class="dock-app" data-app="music" title="Music">
                    <div class="app-icon music-icon">🎵</div>
                </div>
                <div class="dock-app" data-app="appstore" title="App Store">
                    <div class="app-icon appstore-icon">🛍️</div>
                </div>
            </div>
        </div>

        <div class="home-indicator" id="homeIndicator"></div>
    </div>

    <!-- Control Center -->
    <div id="controlCenter" class="control-center">
        <div class="control-center-bg" id="controlCenterBg"></div>
        <div class="control-center-content">
            <div class="control-row">
                <div class="control-group glass">
                    <div class="control-toggle active" data-control="wifi">📶<br><span>Wi-Fi</span></div>
                    <div class="control-toggle active" data-control="bluetooth">🔗<br><span>Bluetooth</span></div>
                    <div class="control-toggle" data-control="airplane">✈️<br><span>Airplane</span></div>
                </div>
                <div class="control-group glass">
                    <div class="control-slider">
                        <div class="slider-label">🔆</div>
                        <input type="range" min="0" max="100" value="80" class="slider">
                    </div>
                    <div class="control-slider">
                        <div class="slider-label">🔊</div>
                        <input type="range" min="0" max="100" value="50" class="slider">
                    </div>
                </div>
            </div>
            <div class="control-row">
                <div class="control-group large glass">
                    <div class="control-btn" data-control="onedesk">🖥️<br><span>OneDesk</span></div>
                    <div class="control-btn" data-control="rotation">🔄<br><span>Rotation</span></div>
                    <div class="control-btn" data-control="focus">🌙<br><span>Focus</span></div>
                    <div class="control-btn" data-control="flashlight">🔦<br><span>Flashlight</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Center -->
    <div id="notificationCenter" class="notification-center">
        <div class="notification-bg" id="notificationBg"></div>
        <div class="notification-content">
            <div class="notification-header">
                <h2>Notifications</h2>
                <button class="btn-clear">Clear All</button>
            </div>
            <div class="notification-list">
                <div class="notification-item glass">
                    <div class="notification-app-icon">📱</div>
                    <div class="notification-info">
                        <div class="notification-title">Software Update</div>
                        <div class="notification-body">OneOS 27.0.1 is available</div>
                        <div class="notification-time">2m ago</div>
                    </div>
                </div>
                <div class="notification-item glass">
                    <div class="notification-app-icon">🛍️</div>
                    <div class="notification-info">
                        <div class="notification-title">App Store</div>
                        <div class="notification-body">Updates available for 3 apps</div>
                        <div class="notification-time">1h ago</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- App Window Template -->
    <div id="appWindow" class="app-window">
        <div class="app-window-header">
            <div class="app-window-controls">
                <button class="window-btn close" id="appClose">×</button>
                <button class="window-btn minimize">−</button>
                <button class="window-btn maximize">□</button>
            </div>
            <div class="app-window-title" id="appWindowTitle">App</div>
        </div>
        <div class="app-window-content" id="appWindowContent"></div>
    </div>

    <!-- OneDesk (Samsung DeX) -->
    <div id="onedeskView" class="onedesk-view">
        <div class="onedesk-header">
            <div class="onedesk-title">OneDesk</div>
            <button class="onedesk-exit" id="onedeskExit">Exit to Home</button>
        </div>
        <div class="onedesk-content">
            <div class="onedesk-taskbar">
                <div class="onedesk-start">⚡ Start</div>
                <div class="onedesk-apps"></div>
                <div class="onedesk-tray">
                    <span id="onedeskTime">9:41</span>
                </div>
            </div>
            <div class="onedesk-desktop">
                <div class="onedesk-desktop-icon" data-app="files">
                    <div class="desktop-icon">📁</div>
                    <span>Files</span>
                </div>
                <div class="onedesk-desktop-icon" data-app="browser">
                    <div class="desktop-icon">🌐</div>
                    <span>Browser</span>
                </div>
                <div class="onedesk-desktop-icon" data-app="settings">
                    <div class="desktop-icon">⚙️</div>
                    <span>Settings</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/oneos.js"></script>
</body>
</html>
